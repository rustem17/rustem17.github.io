<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One specific thing · Rustem Turtayev</title>
    <meta name="description" content="One thing, changing from time to time. Currently: a growing Ulam spiral.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffffff'/%3E%3Cg fill='%23000000'%3E%3Ccircle cx='8' cy='8' r='1.4'/%3E%3Ccircle cx='11' cy='8' r='1.4'/%3E%3Ccircle cx='11' cy='5' r='1.4'/%3E%3Ccircle cx='5' cy='5' r='1.4'/%3E%3Ccircle cx='5' cy='11' r='1.4'/%3E%3Ccircle cx='8' cy='11' r='1.4'/%3E%3C/g%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #fff; color: #444; font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; line-height: 1.6; }
        main { max-width: 1056px; margin: 0 auto; padding: 32px 24px 48px; }
        header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; }
        a { color: #0000ee; text-decoration: underline; text-underline-offset: 3px; }
        a:hover { text-decoration-color: currentColor; }
        a:focus-visible, button:focus-visible { outline: 2px solid #111; outline-offset: 4px; }
        figure { margin: 32px 0 0; }
        .spiral { position: relative; width: min(100%, 80svh, 960px); margin: 0 auto; }
        canvas { display: block; width: 100%; aspect-ratio: 1; }
        figcaption { max-width: 662px; margin: 32px auto 0; }
        p { margin: 0; }
        button { padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
        header > * { color: #0000ee; text-decoration: none; }
        .dot { position: absolute; width: 24px; height: 24px; border-radius: 50%; transform: translate(-50%, -50%); }
        .dot:hover { box-shadow: inset 0 0 0 1px #0000ee; }
        .dot::after { content: ''; position: absolute; inset: 5px; border: 1px solid #0000ee; border-radius: 50%; }
        @media (prefers-reduced-motion: no-preference) { .dot::after { animation: pulse 1.6s ease-out infinite; } }
        @keyframes pulse { from { transform: scale(0.6); opacity: 1; } to { transform: scale(2); opacity: 0; } }
        #card { position: absolute; inset: auto; width: min(280px, 100vw - 32px); margin: 0; padding: 12px; border: 1px solid #ddd; background: #fff; color: #444; font-size: 12px; }
        #card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; margin-bottom: 8px; }
        #card p:not(:last-child) { margin-bottom: 8px; }
        @media (max-width: 480px) { main { padding: 24px 20px 32px; } }
    </style>
</head>
<body>
    <main>
        <header>
            <a href="./" aria-label="back to my page">&lt;--</a>
            <button id="pause" type="button" aria-label="pause" hidden>||</button>
        </header>
        <figure>
            <div class="spiral">
                <canvas id="ulam" role="img" aria-label="A growing Ulam spiral, with grey dots marking prime numbers."></canvas>
                <div id="card" popover></div>
            </div>
            <figcaption>
                <p>An <a href="https://en.wikipedia.org/wiki/Ulam_spiral">Ulam spiral</a>.
                Integers arranged in a square spiral, with a dot at every prime.</p>
            </figcaption>
        </figure>
    </main>
    <script>
        const canvas = document.getElementById('ulam');
        const ctx = canvas.getContext('2d');
        const S = 5;
        const RATE = 240;
        const MAX_FRAME_GAP = 100;
        const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
        let paused = false;
        let raf;
        let last = null, carry = 0;
        let canvasWidth = 0, canvasHeight = 0, canvasDpr = 0;
        let cx = 0, cy = 0, maxOff = 0;
        let x = 0, y = 0, dx = 1, dy = 0;
        let seg = 1, segLeft = 1, turns = 0, n = 1;
        let finished = false;
        const ITEMS = [
            { n: 41, img: 'almaty.jpeg', alt: 'Rustem in Almaty', text: 'photo taken in Almaty, 2025' },
        ];
        const card = document.getElementById('card');
        const dots = {};

        function isPrime(n) {
            if (n < 2) return false;
            if (n % 2 === 0) return n === 2;
            for (let i = 3; i * i <= n; i += 2) if (n % i === 0) return false;
            return true;
        }

        function resetWalker() {
            x = 0; y = 0; dx = 1; dy = 0;
            seg = 1; segLeft = 1; turns = 0; n = 1;
        }

        function step() {
            if (isPrime(n)) {
                const dot = dots[n];
                if (dot) {
                    dot.style.left = `${cx + x * S}px`;
                    dot.style.top = `${cy + y * S}px`;
                    dot.hidden = false;
                }
                ctx.fillStyle = dot ? '#0000ee' : '#aaa';
                ctx.beginPath();
                ctx.arc(cx + x * S, cy + y * S, 2, 0, 2 * Math.PI);
                ctx.fill();
            }
            x += dx; y += dy; n++;
            if (--segLeft === 0) {
                [dx, dy] = [dy, -dx];
                if (++turns % 2 === 0) seg++;
                segLeft = seg;
            }
            return Math.max(Math.abs(x), Math.abs(y)) * S <= maxOff;
        }

        function frame(ts) {
            if (last === null) last = ts;
            const elapsed = Math.min(Math.max(ts - last, 0), MAX_FRAME_GAP);
            carry += elapsed / 1000 * RATE;
            last = ts;
            while (carry >= 1 && !finished) {
                finished = !step();
                carry--;
            }
            if (!finished) raf = requestAnimationFrame(frame);
            else updateButton();
        }

        function updateButton() {
            pauseButton.textContent = finished ? '|<' : paused ? '|>' : '||';
            pauseButton.setAttribute('aria-label', finished ? 'restart' : paused ? 'resume' : 'pause');
        }

        function resume() {
            updateButton();
            cancelAnimationFrame(raf);
            last = null;
            carry = 0;
            if (paused) return;
            if (reducedMotion.matches) {
                while (!finished) finished = !step();
                return;
            }
            if (!finished) raf = requestAnimationFrame(frame);
        }

        function resizeCanvas() {
            const dpr = devicePixelRatio || 1;
            const w = Math.round(canvas.clientWidth);
            const h = Math.round(canvas.clientHeight);
            if (!w || !h) return;
            if (w === canvasWidth && h === canvasHeight && dpr === canvasDpr) return;

            canvasWidth = w;
            canvasHeight = h;
            canvasDpr = dpr;
            canvas.width = Math.round(w * dpr);
            canvas.height = Math.round(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cx = w / 2;
            cy = h / 2;
            maxOff = Math.min(w, h) / 2 - S;
            redraw(n);
        }

        function redraw(targetN) {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            card.togglePopover(false);
            for (const dot of Object.values(dots)) dot.hidden = true;
            resetWalker();
            while (n < targetN) step();
            finished = Math.max(Math.abs(x), Math.abs(y)) * S > maxOff;
            resume();
        }

        function openCard(item, dot) {
            card.innerHTML = (item.img ? `<img src="${item.img}" alt="${item.alt}">` : '') + `<p>${item.text}</p>` + (item.href ? `<a href="${item.href}">[${item.label}]</a>` : '');
            card.togglePopover(true);
            const d = dot.getBoundingClientRect();
            const px = d.left + d.width / 2, py = d.top + d.height / 2;
            let left = px + 16;
            if (left + card.offsetWidth > innerWidth - 16) left = px - 16 - card.offsetWidth;
            card.style.left = `${Math.max(16, left) + scrollX}px`;
            card.style.top = `${Math.max(16, Math.min(py - card.offsetHeight / 2, innerHeight - card.offsetHeight - 16)) + scrollY}px`;
        }

        for (const item of ITEMS) {
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'dot';
            dot.hidden = true;
            dot.setAttribute('aria-label', `prime ${item.n}`);
            dot.addEventListener('click', () => openCard(item, dot));
            card.before(dot);
            dots[item.n] = dot;
        }

        const pauseButton = document.getElementById('pause');
        pauseButton.hidden = reducedMotion.matches;
        pauseButton.addEventListener('click', () => {
            if (finished) {
                paused = false;
                redraw(1);
            } else {
                paused = !paused;
                resume();
            }
        });
        reducedMotion.addEventListener('change', () => {
            pauseButton.hidden = reducedMotion.matches;
        });
        addEventListener('resize', resizeCanvas, { passive: true });
        reducedMotion.addEventListener?.('change', resume);
        resizeCanvas();
    </script>
</body>
</html>
